<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLightCode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="codeCardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.1" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Clean Light Canvas -->
  <rect width="600" height="350" fill="url(#bgLightCode)" />

  <!-- Background Ambience -->
  <circle cx="140" cy="100" r="110" fill="#10b981" fill-opacity="0.14" filter="blur(35px)" />
  <circle cx="480" cy="220" r="100" fill="#0071e3" fill-opacity="0.12" filter="blur(35px)" />

  <!-- Primary Floating Code Editor Window -->
  <g filter="url(#codeCardShadow)">
    <rect x="90" y="65" width="420" height="230" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Window Bar -->
    <rect x="90" y="65" width="420" height="38" rx="18" fill="#f8fafc" />
    <line x1="90" y1="103" x2="510" y2="103" stroke="#f1f5f9" stroke-width="1.5" />

    <!-- Window Dots -->
    <circle cx="116" cy="84" r="5" fill="#ef4444" />
    <circle cx="132" cy="84" r="5" fill="#f59e0b" />
    <circle cx="148" cy="84" r="5" fill="#10b981" />

    <!-- Editor Tab -->
    <rect x="180" y="73" width="130" height="24" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="200" y="89" font-family="Consolas, monospace" font-size="11" font-weight="600" fill="#059669">AppService.cs</text>

    <!-- Line Numbers & Code Content -->
    <g font-family="Consolas, Monaco, monospace" font-size="11.5">
      <!-- Line 1 -->
      <text x="115" y="132" fill="#94a3b8">01</text>
      <text x="145" y="132" fill="#7c3aed" font-weight="600">public class</text>
      <text x="235" y="132" fill="#0f172a" font-weight="bold">KurumsalCozum</text>
      <text x="345" y="132" fill="#475569">{</text>

      <!-- Line 2 -->
      <text x="115" y="156" fill="#94a3b8">02</text>
      <text x="165" y="156" fill="#7c3aed" font-weight="600">public async</text>
      <text x="250" y="156" fill="#0284c7">Task&lt;Result&gt;</text>
      <text x="338" y="156" fill="#059669" font-weight="bold">Start()</text>

      <!-- Line 3 -->
      <text x="115" y="180" fill="#94a3b8">03</text>
      <text x="165" y="180" fill="#475569">{</text>

      <!-- Line 4 -->
      <text x="115" y="204" fill="#94a3b8">04</text>
      <text x="185" y="204" fill="#7c3aed">var</text>
      <text x="212" y="204" fill="#0f172a">sistem =</text>
      <text x="272" y="204" fill="#7c3aed">await</text>
      <text x="312" y="204" fill="#059669">DeployAsync()</text>
      <text x="408" y="204" fill="#475569">;</text>

      <!-- Line 5 -->
      <text x="115" y="228" fill="#94a3b8">05</text>
      <text x="185" y="228" fill="#7c3aed">return</text>
      <text x="232" y="228" fill="#059669">Ok</text>
      <text x="246" y="228" fill="#475569">(</text>
      <text x="254" y="228" fill="#ea580c">"60 FPS &#8226; Hızlı &amp; Güvenli"</text>
      <text x="445" y="228" fill="#475569">);</text>

      <!-- Line 6 -->
      <text x="115" y="252" fill="#94a3b8">06</text>
      <text x="165" y="252" fill="#475569">}</text>

      <!-- Line 7 -->
      <text x="115" y="274" fill="#94a3b8">07</text>
      <text x="145" y="274" fill="#475569">}</text>
    </g>
  </g>

  <!-- Floating Success / Compile Pill Badge -->
  <g filter="url(#codeCardShadow)">
    <rect x="365" y="245" width="165" height="42" rx="21" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
    <circle cx="388" cy="266" r="10" fill="#10b981" />
    <path d="M 385 266 L 387.5 268.5 L 392 263.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="406" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">Build Succeeded</text>
  </g>
</svg>
