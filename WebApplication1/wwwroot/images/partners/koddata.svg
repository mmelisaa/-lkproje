<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <filter id="kdGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- KodData Resmi Logosu (Amblem) -->
  <image href="data:image/png;base64," x="4" y="4" width="46" height="52" preserveAspectRatio="xMidYMid meet" />
  
  <!-- KodData Tipografisi (Ultra Net, Okunabilir ve Canlı) -->
  <g filter="url(#kdGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="28" letter-spacing="2.5">
    <text x="58" y="39" fill="#ffffff">KOD<tspan fill="#f97316">DATA</tspan></text>
  </g>
</svg>
