<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLightApi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="goldCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="apiShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#d97706" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Clean Light Canvas -->
  <rect width="600" height="350" fill="url(#bgLightApi)" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="120" r="110" fill="#fbbf24" fill-opacity="0.18" filter="blur(35px)" />
  <circle cx="450" cy="220" r="95" fill="#10b981" fill-opacity="0.14" filter="blur(35px)" />

  <!-- Floating 3D Credit Card (Glassmorphic Gold/Amber) -->
  <g filter="url(#apiShadow)" transform="rotate(-6 220 170)">
    <rect x="90" y="75" width="280" height="175" rx="16" fill="url(#goldCardGrad)" stroke="#fde68a" stroke-width="1.5" />
    
    <!-- Chip -->
    <rect x="125" y="115" width="42" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" />
    <path d="M 125 131 L 167 131 M 146 115 L 146 147" stroke="#b45309" stroke-width="0.8" />
    
    <!-- Contactless Wave Icon -->
    <path d="M 185 125 A 8 8 0 0 1 185 137 M 190 121 A 14 14 0 0 1 190 141 M 195 117 A 20 20 0 0 1 195 145" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    
    <!-- Card Number Mockup -->
    <text x="125" y="195" font-family="Courier, monospace" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="3">&#8226;&#8226;&#8226;&#8226; &#8226;&#8226;&#8226;&#8226; &#8226;&#8226;&#8226;&#8226; 2026</text>
    
    <!-- Card Brand & Holder -->
    <text x="125" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10" font-weight="600" fill="#fef3c7" letter-spacing="1">HAYAT ISLERI POS</text>
    <circle cx="330" cy="216" r="14" fill="#ef4444" fill-opacity="0.85" />
    <circle cx="346" cy="216" r="14" fill="#fbbf24" fill-opacity="0.85" />
  </g>

  <!-- Floating Security Shield Card -->
  <g filter="url(#apiShadow)">
    <rect x="360" y="85" width="165" height="175" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Shield Graphic -->
    <path d="M 442 110 L 480 124 C 480 156 462 186 442 195 C 422 186 404 156 404 124 Z" fill="linear-gradient(135deg, #10b981, #059669)" />
    <!-- Checkmark inside Shield -->
    <path d="M 430 150 L 438 158 L 456 140" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="442" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">256-Bit SSL</text>
    <text x="442" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">Güvenli API Ağ Geçidi</text>
  </g>

  <!-- Connected API Pulse Node -->
  <g filter="url(#apiShadow)">
    <rect x="230" y="240" width="170" height="42" rx="21" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
    <circle cx="252" cy="261" r="10" fill="#d97706" />
    <path d="M 248 261 L 256 261 M 252 257 L 252 265" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="270" y="265" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">Sanal POS Aktif</text>
  </g>
</svg>
