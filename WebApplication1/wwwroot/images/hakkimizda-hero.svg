<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Arka Plan Yumuşak Apple Light Gradyanı -->
    <linearGradient id="hkLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#e2eeff"/>
    </linearGradient>

    <!-- Apple Blue & Cyan Vurgu Gradyanı -->
    <linearGradient id="hkAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Mor & İndigo Gradyan -->
    <linearGradient id="hkPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Zümrüt Başarı Gradyanı -->
    <linearGradient id="hkGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Kart Arka Planı (Cam Efekti) -->
    <linearGradient id="hkGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.95)"/>
      <stop offset="100%" stop-color="rgba(240, 247, 255, 0.85)"/>
    </linearGradient>

    <!-- Ekran Gradyanı (Light Studio IDE) -->
    <linearGradient id="hkScreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Yumuşak Gölgeler -->
    <filter id="hkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0071e3" flood-opacity="0.12"/>
    </filter>
    <filter id="hkCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="hkGlowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Arka Plan -->
  <rect width="800" height="600" fill="url(#hkLightBg)"/>

  <!-- 2. Arka Plan Mimari Siber Izgara & Veri Çemberleri -->
  <g stroke="#0071e3" stroke-opacity="0.07" stroke-width="1.2">
    <circle cx="400" cy="300" r="260" fill="none"/>
    <circle cx="400" cy="300" r="190" fill="none" stroke-dasharray="6 6"/>
    <circle cx="400" cy="300" r="120" fill="none"/>
    <line x1="140" y1="300" x2="660" y2="300" stroke-dasharray="4 4"/>
    <line x1="400" y1="50" x2="400" y2="550" stroke-dasharray="4 4"/>
  </g>

  <!-- Dekoratif Işık Hüzmeleri -->
  <circle cx="220" cy="180" r="140" fill="#38bdf8" fill-opacity="0.10" filter="url(#hkGlowSubtle)"/>
  <circle cx="580" cy="420" r="160" fill="#6366f1" fill-opacity="0.08" filter="url(#hkGlowSubtle)"/>

  <!-- 3. ANA STÜDYO ÇALIŞMA PLATFORMU (Apple Modern Workstation) -->
  <g filter="url(#hkShadow)" transform="translate(180, 110)">
    
    <!-- Platform Gölge Kaidesi -->
    <ellipse cx="220" cy="360" rx="200" ry="24" fill="#0071e3" fill-opacity="0.08"/>

    <!-- Ana Ekran / iMac & Studio Display Gövdesi -->
    <rect x="50" y="30" width="340" height="230" rx="20" fill="#ffffff" stroke="rgba(0,113,227,0.22)" stroke-width="2"/>
    <rect x="62" y="42" width="316" height="190" rx="14" fill="url(#hkScreenBg)"/>

    <!-- Ekran Üst Barı (macOS Window Controls) -->
    <rect x="62" y="42" width="316" height="30" rx="14" fill="#ffffff" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    <circle cx="82" cy="57" r="4.5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="96" cy="57" r="4.5" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="110" cy="57" r="4.5" fill="#10b981" fill-opacity="0.85"/>
    <text x="220" y="61" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">HayatIsleri.Studio / Architecture.cs</text>

    <!-- Kod & Mimari Arayüz Satırları (Canlı Renkli C# & WebGL Sözdizimi) -->
    <!-- Sol Panel: Kod Editörü -->
    <g transform="translate(80, 85)">
      <!-- Line 1 -->
      <rect x="0" y="5" width="45" height="7" rx="3" fill="#0071e3"/>
      <rect x="52" y="5" width="70" height="7" rx="3" fill="#0284c7"/>
      <!-- Line 2 -->
      <rect x="15" y="20" width="60" height="7" rx="3" fill="#6366f1"/>
      <rect x="80" y="20" width="85" height="7" rx="3" fill="#10b981"/>
      <!-- Line 3 -->
      <rect x="30" y="35" width="95" height="7" rx="3" fill="#3b82f6"/>
      <rect x="130" y="35" width="40" height="7" rx="3" fill="#f59e0b"/>
      <!-- Line 4 -->
      <rect x="30" y="50" width="120" height="7" rx="3" fill="#64748b"/>
      <!-- Line 5 -->
      <rect x="15" y="65" width="50" height="7" rx="3" fill="#0071e3"/>
      <!-- Line 6 -->
      <rect x="0" y="80" width="20" height="7" rx="3" fill="#0071e3"/>

      <!-- Canlı Metin Göstergesi -->
      <text x="0" y="112" fill="#0071e3" font-family="monospace" font-size="11" font-weight="bold">// High Performance Core</text>
      <text x="0" y="128" fill="#10b981" font-family="monospace" font-size="10">✓ 60 FPS WebGL Engine Active</text>
    </g>

    <!-- Sağ Panel: 3D Geometrik Görselleştirme Önizlemesi -->
    <g transform="translate(255, 90)">
      <rect x="0" y="0" width="110" height="125" rx="10" fill="#ffffff" stroke="rgba(0,113,227,0.18)" stroke-width="1.5"/>
      <!-- 3D Dönen İkozahedron Kristal Taslağı -->
      <polygon points="55,20 90,45 80,95 30,95 20,45" fill="none" stroke="#0071e3" stroke-width="1.8"/>
      <polygon points="55,20 55,70 80,95" fill="rgba(0,113,227,0.12)" stroke="#38bdf8" stroke-width="1.2"/>
      <polygon points="55,20 55,70 30,95" fill="rgba(99,102,241,0.12)" stroke="#6366f1" stroke-width="1.2"/>
      <polygon points="20,45 55,70 90,45" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="55" cy="55" r="4" fill="#0071e3"/>
      <text x="55" y="114" fill="#0071e3" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="middle">3D ASTROLABE</text>
    </g>

    <!-- Ekran Standı & Tabanı (Apple Studio Alüminyum Ayak) -->
    <path d="M190,260 L250,260 L242,320 L198,320 Z" fill="#e2e8f0" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <rect x="175" y="320" width="90" height="10" rx="5" fill="#cbd5e1" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  </g>

  <!-- 4. HAVADA SÜZÜLEN CAM KARTLAR (Floating Frosted Glass Cards) -->
  
  <!-- Sol Üst Kart: Güvenilirlik & Performans Rozeti -->
  <g filter="url(#hkCardShadow)" transform="translate(60, 150)">
    <rect x="0" y="0" width="200" height="76" rx="16" fill="url(#hkGlassBg)" stroke="rgba(0,113,227,0.22)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="20" fill="rgba(0,113,227,0.1)"/>
    <!-- CPU / Çip İkonu -->
    <rect x="28" y="28" width="20" height="20" rx="4" fill="none" stroke="#0071e3" stroke-width="2"/>
    <circle cx="38" cy="38" r="3.5" fill="#0071e3"/>
    <line x1="38" y1="24" x2="38" y2="28" stroke="#0071e3" stroke-width="2"/>
    <line x1="38" y1="48" x2="38" y2="52" stroke="#0071e3" stroke-width="2"/>
    <line x1="24" y1="38" x2="28" y2="38" stroke="#0071e3" stroke-width="2"/>
    <line x1="48" y1="38" x2="52" y2="38" stroke="#0071e3" stroke-width="2"/>
    <text x="68" y="32" fill="#0071e3" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1">YAZILIM MİMARİSİ</text>
    <text x="68" y="48" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">ASP.NET Core &amp; C#</text>
    <text x="68" y="62" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">Kurumsal Altyapı</text>
  </g>

  <!-- Sağ Üst Kart: 3D Deneyim & UI/UX Rozeti -->
  <g filter="url(#hkCardShadow)" transform="translate(540, 130)">
    <rect x="0" y="0" width="200" height="76" rx="16" fill="url(#hkGlassBg)" stroke="rgba(99,102,241,0.25)" stroke-width="1.5"/>
    <circle cx="38" cy="38" r="20" fill="rgba(99,102,241,0.1)"/>
    <!-- 3D Prizma İkonu -->
    <polygon points="38,26 48,34 38,42 28,34" fill="none" stroke="#6366f1" stroke-width="2"/>
    <polygon points="38,42 48,34 48,46 38,54" fill="rgba(99,102,241,0.3)" stroke="#6366f1" stroke-width="1.5"/>
    <polygon points="38,42 28,34 28,46 38,54" fill="rgba(99,102,241,0.15)" stroke="#6366f1" stroke-width="1.5"/>
    <text x="68" y="32" fill="#6366f1" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1">KREATİF STÜDYO</text>
    <text x="68" y="48" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Three.js &amp; WebGL</text>
    <text x="68" y="62" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">60 FPS Akıcı Deneyim</text>
  </g>

  <!-- Sağ Alt Kart: Metrik & Başarı Rozeti -->
  <g filter="url(#hkCardShadow)" transform="translate(530, 390)">
    <rect x="0" y="0" width="210" height="82" rx="16" fill="url(#hkGlassBg)" stroke="rgba(16,185,129,0.25)" stroke-width="1.5"/>
    <circle cx="38" cy="41" r="20" fill="rgba(16,185,129,0.1)"/>
    <!-- Kalkan / Güvenlik İkonu -->
    <path d="M38,27 L46,31 L46,41 C46,47 38,52 38,52 C38,52 30,47 30,41 L30,31 Z" fill="none" stroke="#10b981" stroke-width="2"/>
    <polyline points="34,40 37,43 43,36" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="68" y="33" fill="#10b981" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1">%100 GÜVENLİK</text>
    <text x="68" y="50" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">KVKK &amp; SSL Uyumlu</text>
    <text x="68" y="66" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">7/24 Kesintisiz Altyapı</text>
  </g>

  <!-- Sol Alt Kart: Lokasyon & Kurumsal Statü Rozeti -->
  <g filter="url(#hkCardShadow)" transform="translate(80, 410)">
    <rect x="0" y="0" width="190" height="74" rx="16" fill="url(#hkGlassBg)" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>
    <circle cx="36" cy="37" r="18" fill="rgba(245,158,11,0.1)"/>
    <!-- Yıldız / Rozet İkonu -->
    <polygon points="36,25 39,32 46,33 41,38 42,45 36,41 30,45 31,38 26,33 33,32" fill="#f59e0b" fill-opacity="0.8"/>
    <text x="64" y="30" fill="#d97706" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" letter-spacing="1">HAYAT İŞLERİ</text>
    <text x="64" y="46" fill="#1e293b" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Elazığ Merkez</text>
    <text x="64" y="60" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">İşletme Çözümleri</text>
  </g>

  <!-- 5. Kayan Veri Parçacıkları & Parıltılar -->
  <circle cx="280" cy="150" r="3" fill="#0071e3" fill-opacity="0.6"/>
  <circle cx="510" cy="240" r="2.5" fill="#38bdf8" fill-opacity="0.7"/>
  <circle cx="340" cy="460" r="3.5" fill="#6366f1" fill-opacity="0.5"/>
  <circle cx="480" cy="100" r="2" fill="#10b981" fill-opacity="0.8"/>
  <circle cx="210" cy="330" r="2" fill="#0071e3" fill-opacity="0.5"/>
</svg>
