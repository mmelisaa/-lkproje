<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLightSpeed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="speedometerArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="speedShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e11d48" flood-opacity="0.1" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Clean Light Canvas -->
  <rect width="600" height="350" fill="url(#bgLightSpeed)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="110" r="110" fill="#fb7185" fill-opacity="0.16" filter="blur(35px)" />
  <circle cx="450" cy="230" r="100" fill="#38bdf8" fill-opacity="0.14" filter="blur(35px)" />

  <!-- Main Speedometer Gauge Card -->
  <g filter="url(#speedShadow)">
    <rect x="110" y="60" width="380" height="230" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Gauge Center Arc -->
    <!-- Background track -->
    <path d="M 220 185 A 80 80 0 0 1 380 185" fill="none" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round" />
    <!-- Active Speed track (99%) -->
    <path d="M 220 185 A 80 80 0 0 1 378 175" fill="none" stroke="url(#speedometerArc)" stroke-width="14" stroke-linecap="round" />

    <!-- Center Speed Value -->
    <text x="300" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">99</text>
    <text x="300" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669" letter-spacing="1.5">LIGHTHOUSE SKOR</text>

    <!-- Speed Metric Badges below -->
    <g transform="translate(140, 215)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="95" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="47.5" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#059669">0.6s</text>
      <text x="47.5" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#64748b">FCP HIZI</text>

      <!-- Metric 2 -->
      <rect x="112" y="0" width="95" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="159.5" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#0071e3">60 FPS</text>
      <text x="159.5" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#64748b">AKICI RENDER</text>

      <!-- Metric 3 -->
      <rect x="225" y="0" width="95" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="272.5" y="22" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="800" fill="#10b981">0 ms</text>
      <text x="272.5" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" font-weight="600" fill="#64748b">TBT GECİKME</text>
    </g>
  </g>

  <!-- Floating Fast Lightning Pill -->
  <g filter="url(#speedShadow)">
    <rect x="360" y="45" width="155" height="40" rx="20" fill="#ffffff" stroke="#e11d48" stroke-width="1.5" />
    <circle cx="380" cy="65" r="10" fill="#ffe4e6" />
    <path d="M 381 58 L 376 65 L 380 65 L 379 72 L 385 64 L 381 64 Z" fill="#e11d48" />
    <text x="398" y="69" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9f1239">Ultra Optimize</text>
  </g>
</svg>
