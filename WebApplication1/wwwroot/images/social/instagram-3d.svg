<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Soft 3D Elevation Shadow -->
    <filter id="splineTabShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#833ab4" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Warm Luxury 3D Glass Body (No blue - Authentic warm Instagram palette) -->
    <linearGradient id="splineGlassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa7e1e" />
      <stop offset="25%" stop-color="#f56040" />
      <stop offset="55%" stop-color="#e1306c" />
      <stop offset="80%" stop-color="#c13584" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- 3D Beveled Outer Rim (Top-left specular reflection) -->
    <linearGradient id="splineBevelRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0.5" />
    </linearGradient>

    <!-- Top Curved Glass Gloss Reflection (Spline 3D Button Highlight) -->
    <linearGradient id="splineGlossCurve" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Subtle Spherical Ambient Glow -->
    <radialGradient id="splineAmbientGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </radialGradient>

    <!-- Glyph 3D Optical Inset Shadow -->
    <filter id="splineGlyphDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base 3D Tab Cushion with Soft Shadow -->
  <rect x="14" y="12" width="100" height="100" rx="28" ry="28" fill="url(#splineGlassBody)" filter="url(#splineTabShadow)" />

  <!-- Ambient Internal Glass Glow -->
  <rect x="14" y="12" width="100" height="100" rx="28" ry="28" fill="url(#splineAmbientGlow)" />

  <!-- Beveled Specular Border Edge (1.8px) -->
  <rect x="14.9" y="12.9" width="98.2" height="98.2" rx="27.1" ry="27.1" fill="none" stroke="url(#splineBevelRim)" stroke-width="1.8" />

  <!-- Top Glass Highlight Dome Reflection -->
  <path d="M 18 40 C 18 24.5, 26 16, 42 16 L 86 16 C 102 16, 110 24.5, 110 40 C 80 47, 48 50, 18 40 Z" fill="url(#splineGlossCurve)" />

  <!-- Crisp Instagram Camera Glyph with 3D Depth -->
  <g filter="url(#splineGlyphDepth)">
    <!-- Outer Rounded Square -->
    <rect x="38" y="36" width="52" height="52" rx="14.5" ry="14.5" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center Lens -->
    <circle cx="64" cy="62" r="13" fill="none" stroke="#ffffff" stroke-width="5" />
    
    <!-- Top-Right Flash Indicator -->
    <circle cx="78" cy="48" r="3.4" fill="#ffffff" />
  </g>
</svg>
