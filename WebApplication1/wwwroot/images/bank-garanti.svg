<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gbvaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="gbvaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="url(#gbvaGrad)" filter="url(#gbvaGlow)"/>
  <!-- 4 Yapraklı Yonca Simgesi -->
  <g fill="#ffffff" transform="translate(60,60)">
    <!-- Üst Yaprak -->
    <path d="M0,0 C-16,-6 -22,-24 -10,-32 C0,-38 10,-32 10,-32 C10,-32 20,-38 30,-32 C42,-24 36,-6 20,0 Z" transform="translate(-10,-4) scale(0.7)"/>
    <!-- Sağ Yaprak -->
    <path d="M0,0 C-16,-6 -22,-24 -10,-32 C0,-38 10,-32 10,-32 C10,-32 20,-38 30,-32 C42,-24 36,-6 20,0 Z" transform="rotate(90) translate(-10,-4) scale(0.7)"/>
    <!-- Alt Yaprak -->
    <path d="M0,0 C-16,-6 -22,-24 -10,-32 C0,-38 10,-32 10,-32 C10,-32 20,-38 30,-32 C42,-24 36,-6 20,0 Z" transform="rotate(180) translate(-10,-4) scale(0.7)"/>
    <!-- Sol Yaprak -->
    <path d="M0,0 C-16,-6 -22,-24 -10,-32 C0,-38 10,-32 10,-32 C10,-32 20,-38 30,-32 C42,-24 36,-6 20,0 Z" transform="rotate(270) translate(-10,-4) scale(0.7)"/>
    <!-- Merkez Göbek -->
    <circle cx="0" cy="0" r="5" fill="#34d399"/>
  </g>
</svg>
