<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLightMob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="mobShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Clean Light Canvas -->
  <rect width="600" height="350" fill="url(#bgLightMob)" />

  <!-- Ambient Light Orbs -->
  <circle cx="170" cy="110" r="110" fill="#38bdf8" fill-opacity="0.18" filter="blur(35px)" />
  <circle cx="460" cy="230" r="95" fill="#818cf8" fill-opacity="0.15" filter="blur(35px)" />

  <!-- Background Desktop Tablet Preview (Semi-transparent) -->
  <rect x="220" y="55" width="290" height="205" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="220" y="55" width="290" height="32" rx="18" fill="#f8fafc" />
  <circle cx="238" cy="71" r="4.5" fill="#ef4444" />
  <circle cx="252" cy="71" r="4.5" fill="#f59e0b" />
  <circle cx="266" cy="71" r="4.5" fill="#10b981" />
  <rect x="245" y="105" width="240" height="65" rx="10" fill="linear-gradient(135deg, #0284c7, #38bdf8)" />
  <rect x="260" y="122" width="120" height="12" rx="4" fill="#ffffff" />
  <rect x="260" y="142" width="80" height="7" rx="3" fill="#ffffff" fill-opacity="0.7" />

  <!-- Foreground Modern Smartphone (iPhone Style with Dynamic Island) -->
  <g filter="url(#mobShadow)">
    <!-- Phone Body -->
    <rect x="110" y="50" width="135" height="255" rx="28" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    
    <!-- Dynamic Island -->
    <rect x="153" y="60" width="48" height="11" rx="5.5" fill="#0f172a" />
    <circle cx="191" cy="65.5" r="2.5" fill="#1e293b" />

    <!-- Mobile Screen Content -->
    <!-- Mobile Header -->
    <rect x="122" y="80" width="111" height="18" rx="5" fill="#f1f5f9" />
    <circle cx="132" cy="89" r="4" fill="#0284c7" />

    <!-- Mobile Hero -->
    <rect x="122" y="105" width="111" height="60" rx="10" fill="linear-gradient(135deg, #0284c7, #38bdf8)" />
    <rect x="130" y="118" width="65" height="7" rx="3" fill="#ffffff" />
    <rect x="130" y="130" width="85" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.8" />
    <rect x="130" y="145" width="38" height="11" rx="5.5" fill="#ffffff" />

    <!-- Mobile Cards -->
    <rect x="122" y="174" width="111" height="35" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <circle cx="134" cy="191" r="6" fill="#10b981" fill-opacity="0.3" />
    <rect x="146" y="186" width="60" height="5" rx="2" fill="#475569" />
    <rect x="146" y="195" width="40" height="4" rx="2" fill="#94a3b8" />

    <rect x="122" y="216" width="111" height="35" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <circle cx="134" cy="233" r="6" fill="#7c3aed" fill-opacity="0.3" />
    <rect x="146" y="228" width="55" height="5" rx="2" fill="#475569" />
    <rect x="146" y="237" width="35" height="4" rx="2" fill="#94a3b8" />

    <!-- Home Bar Indicator -->
    <rect x="155" y="293" width="45" height="3" rx="1.5" fill="#0f172a" />
  </g>

  <!-- Floating SEO / Mobile Score Badge -->
  <g filter="url(#mobShadow)">
    <rect x="340" y="220" width="180" height="54" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
    <circle cx="368" cy="247" r="14" fill="#dcfce7" />
    <text x="368" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#059669">100</text>
    <text x="392" y="242" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Mobil Uyumluluk</text>
    <text x="392" y="257" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9.5" font-weight="500" fill="#64748b">Google SEO Onaylı &#8226; 100%</text>
  </g>
</svg>
